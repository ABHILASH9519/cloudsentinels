name: AWS architecture checks
on:
  push:
    branches: [feat/aws-native-architecture, feat/n8n-event-automation, feat/acceptance-observability-oidc, feat/four-layer-self-healing-architecture]
  pull_request:
    branches: [main]
    paths:
      - "deploy/aws/serverless/**"
      - "deploy/automation/**"
      - "deploy/kubernetes/**"
      - "docs/architecture/**"
      - "docs/integrations/**"
      - "src/frontend/src/aws/**"
      - "src/frontend/src/App.tsx"
      - "src/frontend/src/main.tsx"
      - "src/frontend/src/hooks/useActor.ts"
      - "src/frontend/src/pages/LoginPage.tsx"
      - "src/frontend/src/components/Layout.tsx"
permissions:
  contents: read
jobs:
  aws-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate SAM template
        run: sam validate --lint --template-file deploy/aws/serverless/runtime-template.yaml
      - name: Build SAM functions and install per-function dependencies
        run: sam build --template-file deploy/aws/serverless/runtime-template.yaml
      - name: Lint persistent CloudFormation template
        run: pip install cfn-lint && cfn-lint deploy/aws/serverless/core-template.yaml deploy/aws/serverless/runtime-template.yaml
      - name: Check Lambda syntax
        run: |
          node --check deploy/aws/serverless/function/index.js
          node --check deploy/aws/serverless/automation/index.js
          node --check deploy/aws/serverless/zapier-relay/index.js
          node --check deploy/aws/serverless/zapier-command/index.js
          node --check deploy/aws/serverless/remediation-worker/index.js
      - name: Run remediation worker tests
        working-directory: deploy/aws/serverless/remediation-worker
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Run Zapier command receiver tests
        working-directory: deploy/aws/serverless/zapier-command
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Run AWS API tests
        working-directory: deploy/aws/serverless/function
        run: |
          npm install --no-audit --no-fund
          node --test
      - name: Run automation processor tests
        working-directory: deploy/aws/serverless/automation
        run: |
          npm install --no-audit --no-fund
          node --test
      - name: Run Zapier relay tests
        working-directory: deploy/aws/serverless/zapier-relay
        run: |
          npm install --no-audit --no-fund
          node --test
