name: Deploy CloudSentinels AWS preview

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudsentinels-aws-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    name: Validate, test and deploy preview runtime
    runs-on: ubuntu-latest
    environment:
      name: preview
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      CLOUDFORMATION_EXECUTION_ROLE_ARN: ${{ vars.CLOUDFORMATION_EXECUTION_ROLE_ARN }}
      APP_ORIGIN: ${{ vars.AWS_APP_ORIGIN }}
      RUNTIME_STACK_NAME: cloudsentinels-runtime
      CORE_STACK_NAME: cloudsentinels-core
      STAGE_NAME: v1
      ZAPIER_WEBHOOK_SECRET_ARN: ${{ vars.ZAPIER_WEBHOOK_SECRET_ARN }}
      ZAPIER_COMMAND_SECRET_ARN: ${{ vars.ZAPIER_COMMAND_SECRET_ARN }}
      CLUSTER_AGENT_SECRET_ARN: ${{ vars.CLUSTER_AGENT_SECRET_ARN }}
      REMEDIATION_ADAPTER_FUNCTION_ARN: ${{ vars.REMEDIATION_ADAPTER_FUNCTION_ARN }}
      REMEDIATION_EXECUTION_ENABLED: ${{ vars.REMEDIATION_EXECUTION_ENABLED || 'false' }}

    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test operations API and Bedrock/telemetry handlers
        working-directory: deploy/aws/serverless/function
        run: |
          npm install --no-audit --no-fund
          node --test

      - name: Test read-only cluster telemetry agent
        run: python3 -m unittest discover -s deploy/agent -p 'test_*.py'

      - name: Test automation processor
        working-directory: deploy/aws/serverless/automation
        run: |
          npm install --no-audit --no-fund
          node --test

      - name: Test optional Zapier relay
        working-directory: deploy/aws/serverless/zapier-relay
        run: |
          npm install --no-audit --no-fund
          node --test

      - name: Test signed Zapier command receiver
        working-directory: deploy/aws/serverless/zapier-command
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Test remediation adapter dispatcher
        working-directory: deploy/aws/serverless/remediation-worker
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: Validate and build SAM application
        run: |
          sam validate --lint --template-file deploy/aws/serverless/runtime-template.yaml
          sam build --template-file deploy/aws/serverless/runtime-template.yaml

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsCloudSentinelsPreview

      - name: Verify deployment account and prerequisites
        id: prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_REGION"
          test -n "$AWS_ACCOUNT_ID"
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$CLOUDFORMATION_EXECUTION_ROLE_ARN"
          test -n "$APP_ORIGIN"
          CALLER_ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$CALLER_ACCOUNT" != "$AWS_ACCOUNT_ID" ]; then
            echo "Refusing deployment: authenticated AWS account does not match configured AWS_ACCOUNT_ID."
            exit 1
          fi
          CORE_STATUS="$(aws cloudformation describe-stacks --stack-name "$CORE_STACK_NAME" --query 'Stacks[0].StackStatus' --output text)"
          case "$CORE_STATUS" in CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE) ;; *)
            echo "Persistent core stack is not in a deployable state: $CORE_STATUS"
            exit 1
          esac
          ARTIFACT_BUCKET="cloudsentinels-sam-artifacts-$AWS_ACCOUNT_ID"
          aws s3api head-bucket --bucket "$ARTIFACT_BUCKET"
          TABLE_NAME="$(aws cloudformation describe-stacks --stack-name "$CORE_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='ApplicationTableName'].OutputValue | [0]" --output text)"
          COGNITO_ISSUER="$(aws cloudformation describe-stacks --stack-name "$CORE_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='CognitoIssuer'].OutputValue | [0]" --output text)"
          USER_POOL_CLIENT_ID="$(aws cloudformation describe-stacks --stack-name "$CORE_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue | [0]" --output text)"
          test -n "$TABLE_NAME" && test "$TABLE_NAME" != "None"
          test -n "$COGNITO_ISSUER" && test "$COGNITO_ISSUER" != "None"
          test -n "$USER_POOL_CLIENT_ID" && test "$USER_POOL_CLIENT_ID" != "None"
          {
            echo "artifact_bucket=$ARTIFACT_BUCKET"
            echo "table_name=$TABLE_NAME"
            echo "cognito_issuer=$COGNITO_ISSUER"
            echo "user_pool_client_id=$USER_POOL_CLIENT_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy runtime stack
        shell: bash
        env:
          ARTIFACT_BUCKET: ${{ steps.prerequisites.outputs.artifact_bucket }}
          TABLE_NAME: ${{ steps.prerequisites.outputs.table_name }}
          COGNITO_ISSUER: ${{ steps.prerequisites.outputs.cognito_issuer }}
          USER_POOL_CLIENT_ID: ${{ steps.prerequisites.outputs.user_pool_client_id }}
        run: |
          set -euo pipefail
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$RUNTIME_STACK_NAME" \
            --s3-bucket "$ARTIFACT_BUCKET" \
            --s3-prefix cloudsentinels-runtime \
            --capabilities CAPABILITY_IAM \
            --role-arn "$CLOUDFORMATION_EXECUTION_ROLE_ARN" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "AppOrigin=$APP_ORIGIN" \
              "LocalDevOrigin=http://localhost:5173" \
              "ApplicationTableName=$TABLE_NAME" \
              "CognitoIssuer=$COGNITO_ISSUER" \
              "UserPoolClientId=$USER_POOL_CLIENT_ID" \
              "StageName=$STAGE_NAME" \
              "ZapierWebhookSecretArn=$ZAPIER_WEBHOOK_SECRET_ARN" \
              "ZapierCommandSecretArn=$ZAPIER_COMMAND_SECRET_ARN" \
              "RemediationAdapterFunctionArn=$REMEDIATION_ADAPTER_FUNCTION_ARN" \
              "RemediationExecutionEnabled=$REMEDIATION_EXECUTION_ENABLED"

      - name: Verify deployed API health
        shell: bash
        run: |
          set -euo pipefail
          API_BASE_URL="$(aws cloudformation describe-stacks --stack-name "$RUNTIME_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='ApiBaseUrl'].OutputValue | [0]" --output text)"
          test -n "$API_BASE_URL" && test "$API_BASE_URL" != "None"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$API_BASE_URL/health"
          echo "Preview API health check passed."
