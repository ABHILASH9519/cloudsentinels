name: CloudSentinels CI

on:
  push:
    branches:
      - feat/golang-four-layer-core
      - feat/golang-review-hardening
      - feat/airtable-cluster-monitoring-zapier
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "deploy/golang/**"
      - "deploy/agent/**"
      - "deploy/lambda/**"
      - "src/frontend/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "Makefile"
      - ".github/workflows/go.yml"
      - ".dockerignore"

permissions:
  contents: read

jobs:
  go:
    name: Go API, agent and Lambda
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Format check
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./...
      - name: Race-enabled tests
        run: go test -race -cover ./...
      - name: Build online API
        run: CGO_ENABLED=0 go build -trimpath ./cmd/cloudsentinels
      - name: Build desktop agent
        run: CGO_ENABLED=0 go build -trimpath ./cmd/cloudsentinels-agent
      - name: Cross-build Lambda ARM64 bootstrap
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -tags lambda.norpc -trimpath -o /tmp/cloudsentinels-lambda ./cmd/cloudsentinels-lambda
      - name: Build API container
        run: docker build -f deploy/golang/Dockerfile -t cloudsentinels:ci .
      - name: Build Kubernetes agent container
        run: docker build -f deploy/agent/Dockerfile -t cloudsentinels-agent:ci .

  frontend:
    name: React UI typecheck, lint and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm check
      - name: Production build
        run: pnpm build
