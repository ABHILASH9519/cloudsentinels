<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">CloudSentinels multi-profile architecture</title>
<desc id="desc">Kubernetes agents send telemetry to the Go API. Floci queues alerts for n8n and stores generated runbooks. Optional AWS profiles connect via their respective adapters. Motion illustrates designed communication.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#0e2036"/></linearGradient>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#62cbdc"/></marker>
  <style>
    text{font-family:system-ui,sans-serif;fill:#f1f7ff}.head{font-size:30px;font-weight:700}.sub{font-size:13px;fill:#a8bed4}.label{font-size:17px;font-weight:650}.small{font-size:12px;fill:#a8bed4}.box{fill:#142943;stroke:#365575;stroke-width:1.4}
    .flow{fill:none;stroke:#62cbdc;stroke-width:2;marker-end:url(#arrow)}.motion{fill:none;stroke:#c2fcff;stroke-width:3;stroke-dasharray:5 40;animation:move 2s linear infinite;pointer-events:none}.optional{fill:none;stroke:#a88cf7;stroke-width:1.6;stroke-dasharray:6 5}
    @keyframes move{to{stroke-dashoffset:-90}}@media(prefers-reduced-motion:reduce){.motion{animation:none}}
  </style>
</defs>
<rect width="1120" height="660" rx="22" fill="url(#bg)"/>
<text x="40" y="52" class="head">CloudSentinels</text>
<text x="40" y="77" class="sub">MULTI-CLUSTER OBSERVABILITY · EVENT-DRIVEN REMEDIATION PLANNING</text>
<rect x="40" y="112" width="1040" height="355" rx="16" fill="#0b192b" stroke="#35536e"/>
<text x="62" y="141" class="small">LOCAL FLOCI PROFILE  /  DOCKER COMPOSE</text>
