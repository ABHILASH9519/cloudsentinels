apiVersion: v1
kind: Namespace
metadata:
  name: cloudsentinels-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudsentinels-agent
  namespace: cloudsentinels-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudsentinels-agent-events-reader
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudsentinels-agent-events-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloudsentinels-agent-events-reader
subjects:
  - kind: ServiceAccount
    name: cloudsentinels-agent
    namespace: cloudsentinels-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudsentinels-agent
  namespace: cloudsentinels-system
  labels:
    app.kubernetes.io/name: cloudsentinels-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudsentinels-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudsentinels-agent
    spec:
      serviceAccountName: cloudsentinels-agent
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: ${IMAGE_REF}
          imagePullPolicy: IfNotPresent
          env:
            - name: CLOUDSENTINELS_API_URL
              valueFrom:
                secretKeyRef:
                  name: cloudsentinels-agent-credentials
                  key: api-url
            - name: CLOUDSENTINELS_CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: cloudsentinels-agent-credentials
                  key: cluster-id
            - name: CLOUDSENTINELS_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: cloudsentinels-agent-credentials
                  key: signing-secret
            - name: SPOOL_DB_PATH
              value: /data/events.sqlite3
            - name: POLL_INTERVAL_SECONDS
              value: "30"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: spool
              mountPath: /data
      volumes:
        - name: spool
          emptyDir:
            sizeLimit: 64Mi
