# Namespace-scoped mutation permissions for the CloudSentinels local agent.
# Read-only cluster-wide access is defined separately in agent-readonly-rbac.yaml.
# This role permits deployment restart/rollback only inside cloudsentinels-system.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudsentinels-agent-deployment-remediation
  namespace: cloudsentinels-system
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudsentinels-agent-deployment-remediation
  namespace: cloudsentinels-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudsentinels-agent-deployment-remediation
subjects:
  - kind: ServiceAccount
    name: cloudsentinels-agent
    namespace: cloudsentinels-system
