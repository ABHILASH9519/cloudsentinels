apiVersion: v1
kind: Namespace
metadata:
  name: cloudsentinels-system
  labels:
    app.kubernetes.io/name: cloudsentinels-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudsentinels-agent
  namespace: cloudsentinels-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudsentinels-agent-readonly
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudsentinels-agent-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloudsentinels-agent-readonly
subjects:
  - kind: ServiceAccount
    name: cloudsentinels-agent
    namespace: cloudsentinels-system
