AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CloudSentinels stable API and Lambda runtime; pause Lambda concurrency between sessions.

Parameters:
  AppOrigin:
    Type: String
    AllowedPattern: "^https://[A-Za-z0-9.-]+(:[0-9]+)?$"
  LocalDevOrigin:
    Type: String
    Default: http://localhost:5173
    AllowedPattern: "^http://localhost(:[0-9]+)?$"
  ApplicationTableName:
    Type: String
  CognitoIssuer:
    Type: String
  UserPoolClientId:
    Type: String
  StageName:
    Type: String
    Default: v1

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref ApplicationTableName
        STAGE_NAME: !Ref StageName
        EVENT_BUS_NAME: !Ref CloudSentinelsEventBus

Resources:
  CloudSentinelsEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: cloudsentinels-domain-events

  AutomationDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: cloudsentinels-automation-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  AutomationEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: cloudsentinels-automation-events
      VisibilityTimeout: 120
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AutomationDeadLetterQueue.Arn
        maxReceiveCount: 5

  AutomationEventsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref AutomationEventsQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt AutomationEventsQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt AutomationEventRule.Arn

  AutomationEventRule:
    Type: AWS::Events::Rule
    DependsOn: AutomationEventsQueuePolicy
    Properties:
      Name: cloudsentinels-domain-events-to-sqs
      EventBusName: !Ref CloudSentinelsEventBus
      EventPattern:
        source:
          - cloudsentinels.api
        detail-type:
          - IncidentCreated
          - IncidentUpdated
          - AlertCreated
          - MetricRecorded
      Targets:
        - Id: AutomationEventsQueueTarget
          Arn: !GetAtt AutomationEventsQueue.Arn
          DeadLetterConfig:
            Arn: !GetAtt AutomationDeadLetterQueue.Arn

  OperationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: function/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ApplicationTableName
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref CloudSentinelsEventBus
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
        Me:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me
            Method: GET
            Auth:
              Authorizer: CognitoJwtAuthorizer
        Profile:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /profile
            Method: ANY
            Auth:
              Authorizer: CognitoJwtAuthorizer
        Incidents:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /incidents
            Method: ANY
            Auth:
              Authorizer: CognitoJwtAuthorizer
        Incident:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /incidents/{id}
            Method: ANY
            Auth:
              Authorizer: CognitoJwtAuthorizer
        Alerts:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /alerts
            Method: ANY
            Auth:
              Authorizer: CognitoJwtAuthorizer
        Alert:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /alerts/{id}
            Method: ANY
            Auth:
              Authorizer: CognitoJwtAuthorizer
        Metrics:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /metrics
            Method: ANY
            Auth:
              Authorizer: CognitoJwtAuthorizer
        Comments:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /incidents/{id}/comments
            Method: ANY
            Auth:
              Authorizer: CognitoJwtAuthorizer

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      CorsConfiguration:
        AllowOrigins: [!Ref AppOrigin, !Ref LocalDevOrigin]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PATCH, PUT, DELETE, OPTIONS]
        MaxAge: 600
      Auth:
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Ref CognitoIssuer
              audience:
                - !Ref UserPoolClientId

Outputs:
  ApiBaseUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"
  OperationsFunctionName:
    Value: !Ref OperationsFunction
  EventBusName:
    Value: !Ref CloudSentinelsEventBus
  AutomationQueueUrl:
    Value: !Ref AutomationEventsQueue
  AutomationQueueArn:
    Value: !GetAtt AutomationEventsQueue.Arn
  AutomationDeadLetterQueueUrl:
    Value: !Ref AutomationDeadLetterQueue
