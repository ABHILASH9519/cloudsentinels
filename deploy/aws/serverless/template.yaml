AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CloudSentinels AWS-native stack (Cognito + API Gateway + Lambda + DynamoDB).

Parameters:
  AppOrigin:
    Type: String
    Description: Exact HTTPS frontend origin, e.g. https://cloudsentinels.vercel.app
    AllowedPattern: "^https://[A-Za-z0-9.-]+(:[0-9]+)?$"
    ConstraintDescription: Supply an HTTPS origin only, without a path.
  CognitoDomainPrefix:
    Type: String
    Description: Globally unique Cognito hosted UI domain prefix (lowercase, 1-63 chars).
    AllowedPattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
    ConstraintDescription: Use 1-63 lowercase letters, digits, or hyphens; start and end with a letter or digit.
  StageName:
    Type: String
    Default: v1

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref ApplicationTable

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: cloudsentinels-web
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs:
        - !Sub "${AppOrigin}/"
      LogoutURLs:
        - !Sub "${AppOrigin}/"

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool

  ApplicationTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-app"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  OperationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: function/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ApplicationTable
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
        Me:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me
            Method: GET
            Auth:
              Authorizer: CognitoJwtAuthorizer
        Profile:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /profile
            Method: ANY
            Auth:
              Authorizer: CognitoJwtAuthorizer
        Incidents:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /incidents
            Method: ANY
            Auth:
              Authorizer: CognitoJwtAuthorizer
        Incident:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /incidents/{id}
            Method: ANY
            Auth:
              Authorizer: CognitoJwtAuthorizer
        Alerts:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /alerts
            Method: ANY
            Auth:
              Authorizer: CognitoJwtAuthorizer
        Alert:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /alerts/{id}
            Method: ANY
            Auth:
              Authorizer: CognitoJwtAuthorizer
        Metrics:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /metrics
            Method: ANY
            Auth:
              Authorizer: CognitoJwtAuthorizer
        Comments:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /incidents/{id}/comments
            Method: ANY
            Auth:
              Authorizer: CognitoJwtAuthorizer

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      CorsConfiguration:
        AllowOrigins: [!Ref AppOrigin]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PATCH, PUT, DELETE, OPTIONS]
        MaxAge: 600
      Auth:
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CognitoIssuer:
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
  CognitoHostedUi:
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  ApiBaseUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"
