apiVersion: v1
kind: Namespace
metadata:
  name: cloudsentinels-benchmark
  labels:
    app.kubernetes.io/part-of: cloudsentinels
    cloudsentinels.io/profile: review
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: benchmark-parity
  namespace: cloudsentinels-benchmark
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "3"
    limits.memory: 3Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: benchmark-defaults
  namespace: cloudsentinels-benchmark
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
      max:
        cpu: "1"
        memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: benchmark-api
  namespace: cloudsentinels-benchmark
  labels:
    app.kubernetes.io/name: benchmark-api
    app.kubernetes.io/part-of: cloudsentinels
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: benchmark-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: benchmark-api
        app.kubernetes.io/part-of: cloudsentinels
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: benchmark-api
  namespace: cloudsentinels-benchmark
spec:
  selector:
    app.kubernetes.io/name: benchmark-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: benchmark-worker
  namespace: cloudsentinels-benchmark
  labels:
    app.kubernetes.io/name: benchmark-worker
    app.kubernetes.io/part-of: cloudsentinels
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: benchmark-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: benchmark-worker
        app.kubernetes.io/part-of: cloudsentinels
    spec:
      containers:
        - name: bounded-load
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - "yes > /dev/null & yes > /dev/null & wait"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
