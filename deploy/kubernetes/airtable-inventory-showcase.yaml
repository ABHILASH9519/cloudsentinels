---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cloudsentinels-gp3
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  type: gp3
  encrypted: "true"
  fsType: ext4
reclaimPolicy: Delete
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airtable-inventory-ebs
  namespace: cloudsentinels-showcase
  labels:
    app.kubernetes.io/name: cloudsentinels-inventory
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: cloudsentinels-gp3
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airtable-inventory
  namespace: cloudsentinels-showcase
  labels:
    app.kubernetes.io/name: airtable-inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airtable-inventory
  template:
    metadata:
      labels:
        app: airtable-inventory
    spec:
      initContainers:
        - name: seed-ebs
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /persistent/inventory
              cp /source/inventory.json /persistent/inventory/inventory.json
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: inventory-ebs
              mountPath: /persistent
      containers:
        - name: inventory-http
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: inventory-ebs
              mountPath: /usr/share/nginx/html/inventory
              subPath: inventory
              readOnly: true
          readinessProbe:
            httpGet:
              path: /inventory/inventory.json
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: source
          configMap:
            name: airtable-inventory-source
        - name: inventory-ebs
          persistentVolumeClaim:
            claimName: airtable-inventory-ebs
---
apiVersion: v1
kind: Service
metadata:
  name: airtable-inventory
  namespace: cloudsentinels-showcase
spec:
  type: ClusterIP
  selector:
    app: airtable-inventory
  ports:
    - name: http
      port: 80
      targetPort: http
