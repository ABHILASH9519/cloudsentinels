AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CloudSentinels non-production review-day EKS cluster. Invoked only by the
  protected manual workflow after review approval. Uses owner-approved VPC,
  private subnets, and pre-reviewed IAM roles.
Parameters:
  ClusterName:
    Type: String
    MinLength: 1
    MaxLength: 55
    AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
  KubernetesVersion:
    Type: String
    AllowedPattern: '^1[.][0-9]{2}$'
    Description: Choose a version currently supported by EKS in the target region.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Owner-approved VPC containing all supplied private subnets.
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two private subnets in distinct availability zones.
  ClusterRoleArn:
    Type: String
    AllowedPattern: '^arn:aws:iam::[0-9]{12}:role/.+$'
  NodeRoleArn:
    Type: String
    AllowedPattern: '^arn:aws:iam::[0-9]{12}:role/.+$'
  NodeInstanceType:
    Type: String
    AllowedPattern: '^[a-z][0-9a-z.]+$'
  MinSize:
    Type: Number
    MinValue: 1
    MaxValue: 5
  DesiredSize:
    Type: Number
    MinValue: 1
    MaxValue: 5
  MaxSize:
    Type: Number
    MinValue: 1
    MaxValue: 5
  PublicAccessCidrs:
    Type: CommaDelimitedList
    Description: Narrow IPv4 CIDR allowlist; 0.0.0.0/0 is forbidden.
Resources:
  CloudSentinelsReviewCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Ref ClusterName
      Version: !Ref KubernetesVersion
      RoleArn: !Ref ClusterRoleArn
      ResourcesVpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        EndpointPrivateAccess: true
        EndpointPublicAccess: true
        PublicAccessCidrs: !Ref PublicAccessCidrs
      AccessConfig:
        AuthenticationMode: API_AND_CONFIG_MAP
        BootstrapClusterCreatorAdminPermissions: true
      Tags:
        - Key: project
          Value: cloudsentinels
        - Key: environment
          Value: minor-review
        - Key: cloudsentinels:approved-vpc-id
          Value: !Ref VpcId
        - Key: lifecycle
          Value: review-day
  CloudSentinelsReviewNodeGroup:
    Type: AWS::EKS::Nodegroup
    Properties:
      ClusterName: !Ref CloudSentinelsReviewCluster
      NodegroupName: !Join ['', [!Ref ClusterName, '-workers']]
      NodeRole: !Ref NodeRoleArn
      Subnets: !Ref PrivateSubnetIds
      InstanceTypes:
        - !Ref NodeInstanceType
      CapacityType: ON_DEMAND
      AmiType: AL2023_x86_64_STANDARD
      ScalingConfig:
        MinSize: !Ref MinSize
        DesiredSize: !Ref DesiredSize
        MaxSize: !Ref MaxSize
      UpdateConfig:
        MaxUnavailable: 1
      Labels:
        project: cloudsentinels
        environment: minor-review
      Tags:
        project: cloudsentinels
        environment: minor-review
        lifecycle: review-day
Outputs:
  ClusterName:
    Value: !Ref CloudSentinelsReviewCluster
  ClusterArn:
    Value: !GetAtt CloudSentinelsReviewCluster.Arn
  ClusterEndpoint:
    Value: !GetAtt CloudSentinelsReviewCluster.Endpoint
  NodeGroupName:
    Value: !Ref CloudSentinelsReviewNodeGroup
